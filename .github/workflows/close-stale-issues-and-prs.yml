name: Manage stale issues and pull requests

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: stale-management
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-issue-stale: 21
          days-before-pr-stale: 21
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-message: >-
            This issue has had no activity for 21 days and is now marked stale.
            Comment or remove the stale label within 7 days to keep it open.
          stale-pr-message: >-
            This pull request has had no activity for 21 days and is now marked stale.
            Comment, push a commit, or remove the stale label within 7 days to keep it open.
          close-issue-message: >-
            This issue was closed after 7 additional days without activity.
            Reopen it if the work becomes active again.
          close-pr-message: >-
            This pull request was closed after 7 additional days without activity.
            Reopen it when the work is ready to continue.
          close-issue-reason: not_planned
          exempt-issue-labels: security,pinned,never-stale,ready-for-ada
          exempt-pr-labels: security,pinned,never-stale
          exempt-all-assignees: true
          exempt-all-milestones: true
          remove-stale-when-updated: true
          operations-per-run: 10
          ascending: true
